name: CI

on:
  pull_request:
    branches:
      - main
      - develop
permissions: {}
jobs:
  malware_security_scan:
    name: Malware Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Malware Scanner
        uses: dell/common-github-actions/malware-scanner@c63b13266a54b23b4b7b6e9812e3e677357a5e64
        with:
          directories: .
          options: -ri
  run_skeleton_suite:
    name: Run Skeleton Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: digital-preservation/droid
          path: 'droid'
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          java-version: 21
          distribution: temurin
      - run: .github/scripts/branch_test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: signature-file.xml
          path: signature-file.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: container-signature-file.xml
          path: container-signature-file.xml
            
          

